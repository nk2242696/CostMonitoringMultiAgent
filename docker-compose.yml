name: azure-cost-monitor

x-app-environment: &app-environment
  ENVIRONMENT: docker
  CONFIG_DIR: /app/config
  DB_HOST: postgres
  DB_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-azure_cost}
  POSTGRES_USER: ${POSTGRES_USER:-cost_monitor}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
  AZURE_SUBSCRIPTION_IDS: ${AZURE_SUBSCRIPTION_IDS:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o}
  LLM_API_VERSION: ${LLM_API_VERSION:-2024-12-01-preview}
  AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-false}
  AGENT_CHAT_MODEL: ${AGENT_CHAT_MODEL:-}
  AGENT_BACKGROUND_MODEL: ${AGENT_BACKGROUND_MODEL:-}
  AGENT_NODE_TIMEOUT_SECONDS: ${AGENT_NODE_TIMEOUT_SECONDS:-60}
  AGENT_WORKFLOW_TIMEOUT_SECONDS: ${AGENT_WORKFLOW_TIMEOUT_SECONDS:-180}
  AGENT_MAX_REFINEMENT_ROUNDS: ${AGENT_MAX_REFINEMENT_ROUNDS:-2}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
  AGENT_MAX_MODEL_CALLS: ${AGENT_MAX_MODEL_CALLS:-12}
  AGENT_CHECKPOINT_RETENTION_DAYS: ${AGENT_CHECKPOINT_RETENTION_DAYS:-30}
  AGENT_BACKGROUND_SCHEDULE: ${AGENT_BACKGROUND_SCHEDULE:-0 0 * * 0}
  DATABRICKS_HOST: ${DATABRICKS_HOST:-}
  DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
  WORKSPACE_CONFIG_PATH: /app/config/workspace.yaml

x-app-service: &app-service
  build:
    context: .
  image: azure-cost-monitor:${APP_VERSION:-local}
  environment: *app-environment
  networks:
    - cost-monitor
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-azure_cost}
      POSTGRES_USER: ${POSTGRES_USER:-cost_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cost-monitor
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cost_monitor} -d ${POSTGRES_DB:-azure_cost}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-service
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 20s
      retries: 5

  worker:
    <<: *app-service
    command: ["python", "-m", "src.cli", "scheduler"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cost-monitor
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/azure-cost-trends.json
      POSTGRES_DB: ${POSTGRES_DB:-azure_cost}
      POSTGRES_USER: ${POSTGRES_USER:-cost_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data_v11:/var/lib/grafana
      - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - cost-monitor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  grafana_data_v11:

networks:
  cost-monitor:
    driver: bridge
