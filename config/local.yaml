# Lightweight config for local development without PostgreSQL.
# Uses SQLite — no extra services needed.

azure:
  tenant_id: "${AZURE_TENANT_ID:your-tenant-id}"
  subscription_ids:
    - "${AZURE_SUBSCRIPTION_ID:your-subscription-id}"
  use_managed_identity: false
  client_id: "${AZURE_CLIENT_ID:}"
  client_secret: "${AZURE_CLIENT_SECRET:}"

database:
  host: ""
  port: 0
  database: "cost_agent.db"
  username: ""
  password: ""
  pool_size: 5
  max_overflow: 10
  echo_sql: false
  # Special flag — config.py will detect empty host and use SQLite
  use_sqlite: true

redis:
  host: "localhost"
  port: 6379
  db: 0
  password: null
  decode_responses: true
  max_connections: 10

celery:
  broker_url: "redis://localhost:6379/0"
  result_backend: "redis://localhost:6379/0"

api:
  title: "Azure Cost Optimization Agent"
  version: "2.0.0"
  description: "Cost monitoring, alerting, forecasting, and 3-tier AI recommendations"
  host: "0.0.0.0"
  port: 8000
  debug: true
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
  rate_limit:
    enabled: false

monitoring:
  collection_intervals:
    cost_data: "0 * * * *"
    budget_data: "0 0 * * *"
    usage_data: "0 */6 * * *"
  retention:
    raw_data_days: 90
    aggregated_data_days: 365
  anomaly_detection:
    enabled: false

alerting:
  enabled: true
  default_thresholds:
    budget_warning: 0.75
    budget_critical: 0.90
    budget_exceeded: 1.0
  deduplication_window_minutes: 60
  escalation_timeout_minutes: 30
  notification_channels:
    email:
      enabled: false
    slack:
      enabled: false
    teams:
      enabled: false

recommendations:
  enabled: true
  analysis_schedule: "0 0 * * 0"
  lookback_days: 30
  minimum_savings_threshold: 10.0
  confidence_threshold: 0.70
  analyzers: {}

logging:
  level: "INFO"
  format: "text"
  output: "console"
  file_path: "logs/app.log"
  rotation: "1 day"
  retention: "30 days"
  include_request_id: false

security:
  secret_key: "local-dev-secret-key-change-me"
  use_key_vault: false

features:
  enable_ml_anomaly_detection: false
  enable_forecasting: true
  enable_auto_remediation: false
  enable_recommendation_tracking: true
  enable_savings_reporting: true
