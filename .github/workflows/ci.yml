name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Check for critical Python errors
        run: python -m ruff check --select E9,F63,F7,F82 src tests

      - name: Run unit tests
        run: python -m pytest --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  container:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      SECRET_KEY: ci-only-application-secret
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: azure-cost-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
