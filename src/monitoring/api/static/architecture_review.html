<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Review Widget</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            color: #333;
            padding: 20px;
        }
        
        .review-widget {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .header h1 {
            font-size: 24px;
            color: #1a73e8;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #1a73e8;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1557b0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        .form-group textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }
        
        .form-group textarea:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results {
            margin-top: 30px;
        }
        
        .result-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #1a73e8;
        }
        
        .result-section h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #1a73e8;
        }
        
        .result-section.proposal {
            border-left-color: #34a853;
        }
        
        .result-section.review {
            border-left-color: #fbbc04;
        }
        
        .result-section.decision {
            border-left-color: #ea4335;
        }
        
        .markdown-content {
            line-height: 1.6;
            color: #333;
        }
        
        .markdown-content h3 {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #555;
        }
        
        .markdown-content ul, .markdown-content ol {
            margin-left: 20px;
            margin-bottom: 10px;
        }
        
        .markdown-content code {
            background: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 16px;
            border-radius: 4px;
            margin-top: 20px;
        }
        
        .recent-reviews {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }
        
        .review-list {
            list-style: none;
        }
        
        .review-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .review-item:hover {
            background: #e8e9ea;
        }
        
        .review-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        
        .review-id {
            font-weight: 500;
            color: #1a73e8;
        }
        
        .review-date {
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="review-widget">
        <div class="header">
            <h1>🏗️ Architecture Review Agent</h1>
            <button class="btn btn-primary" onclick="showForm()">New Review</button>
        </div>
        
        <div id="reviewForm" style="display: block;">
            <div class="form-group">
                <label for="problemStatement">Problem Statement</label>
                <textarea 
                    id="problemStatement" 
                    placeholder="Describe your architecture problem or migration scenario...

Example:
We need to migrate our cost monitoring system to Azure.
Current Setup: 10 subscriptions, PostgreSQL, Docker
Requirements: Scale to 50+ subscriptions, 100+ users, ML forecasting
Constraints: $2000-3000/month budget, 3 months timeline, 2 engineers
Goals: Improve performance 10x, reduce operational overhead"
                ></textarea>
            </div>
            <button class="btn btn-primary" onclick="runReview()">Run Architecture Review</button>
        </div>
        
        <div id="loading" style="display: none;">
            <div class="loading">
                <div class="spinner"></div>
                <p>Running three-agent architecture review...</p>
                <p style="color: #666; margin-top: 10px;">This may take 2-3 minutes</p>
            </div>
        </div>
        
        <div id="error" style="display: none;" class="error"></div>
        
        <div id="results" style="display: none;">
            <div class="results">
                <div class="result-section proposal">
                    <h2>🏗️ Architecture Proposal</h2>
                    <div id="proposalContent" class="markdown-content"></div>
                </div>
                
                <div class="result-section review">
                    <h2>👨‍💻 Review & Assessment</h2>
                    <div id="reviewContent" class="markdown-content"></div>
                </div>
                
                <div class="result-section decision">
                    <h2>✅ Final Decision</h2>
                    <div id="decisionContent" class="markdown-content"></div>
                </div>
            </div>
        </div>
        
        <div class="recent-reviews">
            <h2>Recent Reviews</h2>
            <ul id="reviewList" class="review-list"></ul>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.origin;
        
        async function runReview() {
            const problemStatement = document.getElementById('problemStatement').value.trim();
            
            if (!problemStatement) {
                alert('Please enter a problem statement');
                return;
            }
            
            document.getElementById('reviewForm').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('results').style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE}/architecture/review`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        problem_statement: problemStatement
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                displayResults(data);
                loadRecentReviews();
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = `Error: ${error.message}`;
            }
        }
        
        function displayResults(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            
            // Simple markdown-to-HTML conversion
            document.getElementById('proposalContent').innerHTML = formatMarkdown(data.proposal);
            document.getElementById('reviewContent').innerHTML = formatMarkdown(data.review);
            document.getElementById('decisionContent').innerHTML = formatMarkdown(data.decision);
        }
        
        function formatMarkdown(text) {
            // Basic markdown formatting
            return text
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h3>$1</h3>')
                .replace(/^# (.*$)/gim, '<h3>$1</h3>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\n\n/g, '<br><br>')
                .replace(/\n/g, '<br>');
        }
        
        async function loadRecentReviews() {
            try {
                const response = await fetch(`${API_BASE}/architecture/reviews`);
                const data = await response.json();
                
                const reviewList = document.getElementById('reviewList');
                reviewList.innerHTML = '';
                
                if (data.reviews.length === 0) {
                    reviewList.innerHTML = '<li style="color: #666;">No reviews yet</li>';
                    return;
                }
                
                data.reviews.forEach(review => {
                    const li = document.createElement('li');
                    li.className = 'review-item';
                    li.onclick = () => loadReview(review.review_id);
                    
                    li.innerHTML = `
                        <div class="review-item-header">
                            <span class="review-id">${review.review_id}</span>
                            <span class="review-date">${new Date(review.created_at).toLocaleString()}</span>
                        </div>
                    `;
                    
                    reviewList.appendChild(li);
                });
            } catch (error) {
                console.error('Error loading reviews:', error);
            }
        }
        
        async function loadReview(reviewId) {
            try {
                const response = await fetch(`${API_BASE}/architecture/review/${reviewId}`);
                const data = await response.json();
                
                document.getElementById('reviewForm').style.display = 'none';
                displayResults(data);
            } catch (error) {
                console.error('Error loading review:', error);
                alert('Error loading review');
            }
        }
        
        function showForm() {
            document.getElementById('reviewForm').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }
        
        // Load recent reviews on page load
        loadRecentReviews();
    </script>
</body>
</html>
