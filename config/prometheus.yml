global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'cost-monitoring'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Cost Monitoring API metrics
  - job_name: 'cost-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  # Custom cost exporter
  - job_name: 'cost-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['exporter:8001']

  # PostgreSQL exporter (optional)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
