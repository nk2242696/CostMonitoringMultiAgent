# Azure Configuration
azure:
  tenant_id: "${AZURE_TENANT_ID}"
  subscription_ids: "${AZURE_SUBSCRIPTION_IDS}"  # Comma-separated
  use_managed_identity: false
  client_id: "${AZURE_CLIENT_ID}"
  client_secret: "${AZURE_CLIENT_SECRET}"
  
# Database Configuration
database:
  host: "${DB_HOST}"
  port: 5432
  database: "azure_cost_staging"
  username: "${DB_USERNAME}"
  password: "${DB_PASSWORD}"
  pool_size: 20
  max_overflow: 40
  echo_sql: false

# Redis Configuration
redis:
  host: "${REDIS_HOST}"
  port: 6379
  db: 0
  password: "${REDIS_PASSWORD}"
  decode_responses: true
  max_connections: 100

# Celery Configuration
celery:
  broker_url: "${CELERY_BROKER_URL}"
  result_backend: "${CELERY_RESULT_BACKEND}"
  task_serializer: "json"
  result_serializer: "json"
  accept_content: ["json"]
  timezone: "UTC"
  enable_utc: true

# API Configuration
api:
  title: "Azure Cost Management System"
  version: "0.1.0"
  description: "Comprehensive cost monitoring, alerting, and recommendations"
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_origins:
    - "${CORS_ORIGIN}"
  rate_limit:
    enabled: true
    requests_per_minute: 100

# Monitoring Configuration
monitoring:
  collection_intervals:
    cost_data: "0 * * * *"
    budget_data: "0 0 * * *"
    usage_data: "0 */6 * * *"
  retention:
    raw_data_days: 90
    aggregated_data_days: 730
  anomaly_detection:
    enabled: true
    methods:
      - "zscore"
      - "iqr"
    zscore_threshold: 3.0
    iqr_multiplier: 1.5
    lookback_days: 30

# Alerting Configuration
alerting:
  enabled: true
  default_thresholds:
    budget_warning: 0.75
    budget_critical: 0.90
    budget_exceeded: 1.0
    anomaly_deviation_low: 0.25
    anomaly_deviation_medium: 0.50
    anomaly_deviation_high: 0.75
  deduplication_window_minutes: 60
  escalation_timeout_minutes: 30
  notification_channels:
    email:
      enabled: true
      smtp_host: "${SMTP_HOST}"
      smtp_port: 587
      use_tls: true
      from_address: "${SMTP_FROM_ADDRESS}"
      username: "${SMTP_USERNAME}"
      password: "${SMTP_PASSWORD}"
    slack:
      enabled: "${SLACK_ENABLED}"
      webhook_url: "${SLACK_WEBHOOK_URL}"
      default_channel: "#azure-costs-staging"
    teams:
      enabled: "${TEAMS_ENABLED}"
      webhook_url: "${TEAMS_WEBHOOK_URL}"
    sms:
      enabled: false
      provider: "twilio"
      account_sid: "${TWILIO_ACCOUNT_SID}"
      auth_token: "${TWILIO_AUTH_TOKEN}"
      from_number: "${TWILIO_FROM_NUMBER}"

# Recommendations Configuration
recommendations:
  enabled: true
  analysis_schedule: "0 0 * * 0"
  lookback_days: 30
  minimum_savings_threshold: 10.0
  confidence_threshold: 0.70
  analyzers:
    compute:
      enabled: true
      right_sizing:
        utilization_threshold: 0.40
        evaluation_days: 30
      idle_detection:
        cpu_threshold: 0.05
        duration_days: 7
      reserved_instances:
        utilization_threshold: 0.70
        payback_months: 12
    storage:
      enabled: true
      orphaned_disk_age_days: 7
      snapshot_age_days: 90
      cool_tier_days_since_access: 30
      archive_tier_days_since_access: 90
    database:
      enabled: true
      idle_detection_days: 7
      utilization_threshold: 0.40
      serverless_pattern_detection: true
    network:
      enabled: true
      unused_ip_age_days: 7
      data_transfer_threshold_gb: 100

# Logging Configuration
logging:
  level: "INFO"
  format: "json"
  output: "both"
  file_path: "logs/app.log"
  rotation: "1 day"
  retention: "30 days"
  include_request_id: true

# Security Configuration
security:
  secret_key: "${SECRET_KEY}"
  key_vault_url: "${KEY_VAULT_URL}"
  use_key_vault: true
  api_key_header: "X-API-Key"
  jwt_algorithm: "HS256"
  access_token_expire_minutes: 60

# Feature Flags
features:
  enable_ml_anomaly_detection: true
  enable_forecasting: true
  enable_auto_remediation: false
  enable_recommendation_tracking: true
  enable_savings_reporting: true
